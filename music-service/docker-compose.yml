services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=music
      - POSTGRES_PASSWORD=music
      - POSTGRES_DB=music_db
    ports:
      - "5433:5432"
    volumes:
      - music_db_vol:/var/lib/postgresql/data
    networks:
      - music-network

volumes:
  music_db_vol:

networks:
  music-network:
    driver: bridge
