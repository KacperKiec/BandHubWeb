spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: music-service
          uri: lb://MUSIC-SERVICE
          predicates:
            - Path=/musician/**, /band/**, /genre/**, /instrument/**
        - id: user-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/account/**, /role/**, /logout
        - id: venue-service
          uri: lb://VENUE-SERVICE
          predicates:
            - Path=/venue/**, /booking/**, /offer/**
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/event/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**, /key/**
#      discovery:
#        locator:
#          enabled: true
#          lower-case-service-id: true
server:
  port: 9000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
