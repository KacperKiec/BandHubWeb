<form>
  <div class="form-group fade-in">

    <label>Nazwa wydarzenia</label>
    <input class="input" name="name" [(ngModel)]="event.name" (ngModelChange)="emit()" required>

    <label>Zespół wydarzenia</label>
    <div class="carousel-container">
      <app-carousel-selector
        [elements]="userBands"
        [selectedOptionId]="event.bandId"
        (emitElement)="selectBand($event)">
      </app-carousel-selector>
    </div>

    <div class="venue-selection-container">
      <div class="selection-tabs">
        <button class="tab-button"
                [class.active]="venueSelectionMode === 'BOOKING'"
                (click)="setVenueMode(VenueSelectionMode.BOOKING)">
          <i class="fas fa-calendar-check"></i> <!-- opcjonalna ikona -->
          Z rezerwacji
        </button>
        <button class="tab-button"
                [disabled]="venues.length === 0"
                [title]="venues.length === 0 ? 'Nie posiadasz zarejestrowanych lokali' : ''"
                [class.active]="venueSelectionMode === 'OWNED'"
                (click)="setVenueMode(VenueSelectionMode.OWNED)">
          <i class="fas fa-building"></i> <!-- opcjonalna ikona -->
          Z moich lokali
        </button>
      </div>

      <div class="venue-content" [ngSwitch]="venueSelectionMode">
        <div *ngSwitchCase="'BOOKING'" class="fade-in">
          <label>Wybierz rezerwację</label>
          <div class="carousel-container">
            <app-carousel-selector
              [elements]="mappedBookings"
              [selectedOptionId]="event.bookingId"
              (emitElement)="selectBooking($event)">
            </app-carousel-selector>
          </div>

          <label>Czas dostępności</label>
          <div class="time-input-container">
            <div class="time-input">
              <p>Początek</p>
              <input class="input" type="time" [(ngModel)]="event.startTime" name="startTime" (ngModelChange)="emit()">
            </div>
            <div class="time-input">
              <p>Koniec</p>
              <input class="input" type="time" [(ngModel)]="event.endTime" name="endTime" (ngModelChange)="emit()">
            </div>
          </div>
        </div>

        <div *ngSwitchCase="'OWNED'" class="fade-in">
          <label>Wybierz lokal</label>
          <div class="carousel-container">
            <app-carousel-selector
              [elements]="venues"
              [selectedOptionId]="event.venueId"
              (emitElement)="selectVenue($event)">
            </app-carousel-selector>
          </div>

          <label>Data</label>
          <input class="input" type="date" [(ngModel)]="event.date" name="date" (ngModelChange)="emit()" required>

          <label>Czas dostępności</label>
          <div class="time-input-container">
            <div class="time-input">
              <p>Początek</p>
              <input class="input" type="time" [(ngModel)]="event.startTime" name="startTime" (ngModelChange)="emit()">
            </div>
            <div class="time-input">
              <p>Koniec</p>
              <input class="input" type="time" [(ngModel)]="event.endTime" name="endTime" (ngModelChange)="emit()">
            </div>
          </div>

        </div>
      </div>
    </div>

    <label>Cena biletu</label>
    <input class="input" type="number" step="0.01" [(ngModel)]="event.ticketPrice" name="pricePerHour" (ngModelChange)="emit()" min="0" required>


    <label>Opis</label>
    <textarea class="input" [(ngModel)]="event.description" (ngModelChange)="emit()" name="description" maxlength="400" rows="4" required></textarea>
  </div>
</form>
