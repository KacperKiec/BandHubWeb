<div class="wrapper">
  <div class="band-details-container fade-in">
    <div class="header">
      <img [src]="band.image" alt="Profile pic" class="profile-pic">
      <div class="basic-info">
        <h1>{{band.name}}</h1>
        <p class="location">📍 {{ band.city }}, {{ band.country }}</p>
        <p class="status">{{ band.isLookingMembers ? '✅ Szuka muzyków' : '❌ Nie szuka muzyków' }}</p>
      </div>
    </div>

    <div class="bio">
      <h2>📝 Bio</h2>
      <p>{{ band.bio }}</p>
    </div>

    <div class="details-grid">
      <div>
        <h3>🎶 Gatunki</h3>
        <ul>
          <li *ngFor="let genre of band.genres">{{ genre.name }}</li>
        </ul>
      </div>

      <div>
        <h3>👥 Członkowie zespołu</h3>
        <div class="band-members">
          <ul class="member-list">
            <li *ngFor="let member of band.musicians" class="member-tile" (click)="getMusicianDetails(member.id)">
              <label class="member-name">{{member.firstName}} {{member.lastName}}{{ band.founderId === member.id ? '👑 ' : '' }}</label>

              <label *ngIf="member.instruments.length <= 3" [innerText]="' - ' + member.instruments.join(', ')" class="instruments-label"></label>
              <label *ngIf="member.instruments.length > 3" [innerText]="' - ' + member.instruments.slice(0, 3) + ', ...'" class="instruments-label"></label>

            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="band-events" (click)="goToBandEvents()">
      <img class="icon" ngSrc="/icons8-event-black-48.png" height="19" width="19" alt="Friends Icon">
      <p>Przeglądaj wydarzenia</p>
    </div>

  </div>
</div>
