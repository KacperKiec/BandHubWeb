<form>
  <div class="form-group">
    <label for="bio">Bio</label>
    <textarea id="bio" [(ngModel)]="band.bio" (ngModelChange)="emit()" name="bio" maxlength="400" rows="4" required></textarea>
  </div>

  <div class="form-group">
    <label>Gatunki muzyczne</label>
    <div class="custom-multiselect" #genreSelect>
      <div class="selected-options" (click)="toggleGenreDropdown()">
        {{ getSelectedGenresText() }}
      </div>
      <div class="options" *ngIf="showGenreDropdown">
        <label *ngFor="let genre of availableGenres">
          {{ genre.name }}
          <input type="checkbox"
                 [checked]="isGenreSelected(genre)"
                 (change)="onGenreChange($event, genre)"
          />
        </label>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="checkbox-inline">
      <input type="checkbox" id="isLookingBand" [(ngModel)]="band.isLookingMembers" (ngModelChange)="emit()" name="isLookingMembers" />
      Szukam muzyków
    </label>
  </div>
</form>
