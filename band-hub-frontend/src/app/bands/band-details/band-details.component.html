<div class="wrapper">
  <div class="band-details-container fade-in">
    <div class="header">
      <div class="band-pic-container">
        <img [src]="band.imageURL || '/assets/user.jpg'" alt="Profile pic" class="band-pic">

        <div class="overlay" (click)="onEditImageClick()" *ngIf="band.founderId === userId">
          <p>📷 Zmień zdjęcie</p>
        </div>

        <input type="file" #fileInput accept="image/*" (change)="onFileSelected($event)" hidden *ngIf="band.founderId === userId">
      </div>
      <div class="basic-info">
        <h1>{{band.name}}</h1>
        <p class="location">📍 {{ band.city }}, {{ band.country }}</p>
        <p class="status">{{ band.isLookingMembers ? '✅ Szuka muzyków' : '❌ Nie szuka muzyków' }}</p>
      </div>
    </div>

    <div class="bio">
      <h2>📝 Bio</h2>
      <p>{{ band.bio }}</p>
    </div>

    <div class="details-grid">
      <div>
        <h3>🎶 Gatunki</h3>
        <ul>
          <li *ngFor="let genre of band.genres">{{ genre.name }}</li>
        </ul>
      </div>

      <div>
        <h3>👥 Członkowie zespołu</h3>
        <div class="band-members">
          <ul class="member-list">
            <li *ngFor="let member of band.musicians" class="member-tile" (click)="getMusicianDetails(member.id)">
              <label class="member-name">{{member.firstName}} {{member.lastName}}{{ band.founderId === member.id ? '👑 ' : '' }}</label>

              <label class="instruments-label">{{ getInstrumentLabel(member.instruments) }}</label>

            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="action-panel">
      <div class="action" (click)="goToBandEvents(band.name)">
        <img class="icon" ngSrc="/icons8-event-48.png" height="19" width="19" alt="Friends Icon">
        <p>Przeglądaj wydarzenia</p>
      </div>

      <div class="action" *ngIf="!isUserInBand()" (click)="sendRequest()">
        <img class="icon" ngSrc="/icons8-mail-30.png" height="19" width="19" alt="Friends Icon">
        <p>Wyślij zgłoszenie</p>
      </div>
    </div>

  </div>
</div>
