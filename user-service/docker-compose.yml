services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=user_db
    ports:
      - "5434:5432"
    volumes:
      - user_db_vol:/var/lib/postgresql/data
    networks:
      - user-network

volumes:
  user_db_vol:

networks:
  user-network:
    driver: bridge
