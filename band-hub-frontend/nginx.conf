server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # (opcjonalnie – proxy do backendu)
  # location /api/ {
  #   proxy_pass http://gateway-service:9000/;
  # }

  error_page 404 /index.html;
}
