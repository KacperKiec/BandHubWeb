<form>
  <div class="form-group fade-in">
    <label>Lokal</label>
    <div class="carousel-container">
      <app-carousel-selector
        [elements]="venues"
        [selectedOptionId]="offer.venueId"
        (emitElement)="selectVenue($event)">
      </app-carousel-selector>
    </div>

    <label>Cena za godzinę</label>
    <input class="input" type="number" step="0.01" [(ngModel)]="offer.pricePerHour" name="pricePerHour" (ngModelChange)="emit()" min="0" required>

    <label>Data</label>
    <input class="input" type="date" [(ngModel)]="offer.date" name="date" (ngModelChange)="emit()" required>

    <label>Czas dostępności</label>
    <div class="time-input-container">
      <div class="time-input">
        <p>Początek</p>
        <input class="input" type="time" [(ngModel)]="offer.startTime" name="startTime" (ngModelChange)="emit()">
      </div>
      <div class="time-input">
        <p>Koniec</p>
        <input class="input" type="time" [(ngModel)]="offer.endTime" name="endTime" (ngModelChange)="emit()">
      </div>
    </div>

    <label>Status oferty</label>
    <select class="input" [(ngModel)]="offer.status" name="status" (ngModelChange)="emit()">
      <option *ngFor="let status of statuses" [value]="status">
        {{ getStatusLabel(status) }}
      </option>
    </select>
  </div>
</form>
