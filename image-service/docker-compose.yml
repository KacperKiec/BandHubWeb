services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=image
      - POSTGRES_PASSWORD=image
      - POSTGRES_DB=image_db
    ports:
      - "5437:5432"
    volumes:
      - image_db_vol:/var/lib/postgresql/data
    networks:
      - image-network

volumes:
  image_db_vol:

networks:
  image-network:
    driver: bridge
