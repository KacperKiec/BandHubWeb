spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5436/event_db
    username: event
    password: event
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8060
