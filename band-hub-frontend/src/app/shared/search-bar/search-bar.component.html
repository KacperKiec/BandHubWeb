<div class="container">
  <div class="upper">
    <div class="search-field search-bar-display">
      <input [placeholder]="placeholderText" type="text" [(ngModel)]="searchFieldContent">
      <img ngSrc="/icons8-search-50.png" height="22" width="22" alt="Search Icon" (click)="confirmSearching()">
    </div>


    <div class="filter-bar search-bar-display" (click)="toggleDropdown()">
      <label>Filtry</label>
      <img ngSrc="/icons8-sliders-30.png" height="22" width="22" alt="Filters Icon">
    </div>
  </div>

  <div class="dropdown-menu" [class.show]="dropdownStatus">
    <ul class="filters-list">
      <li *ngFor="let filter of filters; let i = index">
        <div class="filters-element">
          <label class="filter-label">{{ filter.label }}</label>

          <div class="filter-input" *ngIf="filter.type === 'text' && filter.label !== 'Miasto'">
            <input type="text" [(ngModel)]="filterValue[i]">
          </div>

          <div class="filter-input" *ngIf="filter.type === 'text' && filter.label === 'Miasto'">
            <app-address-search [customClass]="'filter-input'" (address)="getAddress(i, $event)"></app-address-search>
          </div>

          <div class="filter-input" *ngIf="filter.type === 'number'">
            <input type="number" [(ngModel)]="filterValue[i]">
          </div>

          <div class="filter-input" *ngIf="filter.type === 'checkbox'">
            <input type="checkbox" [(ngModel)]="filterValue[i]" style="width: 100%">
          </div>

          <div class="filter-input" *ngIf="filter.type === 'select'">
            <select [(ngModel)]="filterValue[i]" style="width: 100%">
              <option *ngFor="let option of filter.options" [value]="option">{{ option }}</option>
            </select>
          </div>

          <div class="filter-input range-wrapper" *ngIf="filter.type === 'range'">
            <label class="range-label">Od:</label>
            <input type="number" [(ngModel)]="rangeValues[i].min" [min]="filter?.options?.[0] || 0" [max]="filter?.options?.[1] || 99" (ngModelChange)="updateRangeValues(i)">
            <label class="range-label">Do:</label>
            <input type="number" [(ngModel)]="rangeValues[i].max" [min]="filter?.options?.[0] || 0" [max]="filter?.options?.[1] || 99" (ngModelChange)="updateRangeValues(i)">
          </div>

          <button class="filter-button" (click)="addParam(i)">Dodaj</button>
        </div>
      </li>
    </ul>

    <div class="added-params" id="param-box">
      <div *ngFor="let param of currentFilters; let i = index" class="param-element" (click)="removeParam(i)">
        <label>{{ param.name }}: {{ param.value }}</label>
      </div>
    </div>

  </div>
</div>
