spring:
  application:
    name: venue-service
  datasource:
    url: jdbc:postgresql://localhost:5435/venue_db
    username: venue
    password: venue
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8070
