spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4202"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allow-credentials: true
      routes:
        - id: music-service
          uri: lb://MUSIC-SERVICE
          predicates:
            - Path=/musician/**, /band/**, /genre/**, /instrument/**
        - id: user-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/account/**, /role/**, /logout
        - id: venue-service
          uri: lb://VENUE-SERVICE
          predicates:
            - Path=/venue/**, /booking/**, /offer/**
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/event/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**, /key/**, /oauth2/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification/**, /ws/notifications/**
          metadata:
            websocket: true
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chat/**, /ws/chat/**
          metadata:
            websocket: true
        - id: image-service
          uri: lb://IMAGE-SERVICE
          predicates:
            - Path=/image/**
#      discovery:
#        locator:
#          enabled: true
#          lower-case-service-id: true
server:
  port: 9000
  forward-headers-strategy: framework
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.web.cors: DEBUG
    org.springframework.web: DEBUG