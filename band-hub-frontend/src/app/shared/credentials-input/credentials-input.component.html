<div class="account-info">
  <input name="email" [(ngModel)]="formData.email" (blur)="validateEmail()" (ngModelChange)="onInputChange()" placeholder="Email" required>
  <input name="password" [(ngModel)]="formData.password" (blur)="validatePasswords()" type="password" placeholder="Hasło" required>
  <input name="repeatPassword" [(ngModel)]="formData.repeatPassword" (blur)="validatePasswords()" type="password" placeholder="Powtórz hasło" required>
</div>
