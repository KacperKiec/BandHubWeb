<div class="container fade-in">
  <form class="form-container" #registerForm="ngForm" (ngSubmit)="submitForm()">

    <app-personal-info-input (accountChange)="getPersonalData($event)"></app-personal-info-input>

    <app-credentials-input (credentials)="getCredentials($event)"></app-credentials-input>

    <button class="register-button" type="submit">Zarejestruj</button>

  </form>

</div>
