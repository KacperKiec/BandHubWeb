services:
  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=user
      - POSTGRES_DB=user_db
    ports:
      - "5434:5432"
    volumes:
      - user_db_vol:/var/lib/postgresql/data
    networks:
      - user-network

  account-service:
    build: .
    container_name: account-service
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
    ports:
      - "8090:8090"
    networks:
      - user-network

volumes:
  user_db_vol:

networks:
  user-network:
    driver: bridge
