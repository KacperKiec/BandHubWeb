spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5438/notification_db
    username: notif
    password: notif
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: dev
    password: dev
    virtual-host: /
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/key/jwks.json
          jws-algorithms: RS256
          issuer-uri: http://localhost:8020
server:
  port: 8030
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
app:
  rabbit:
    queue: "notification-queue"
    exchange: "notification-exchange"
    routing-key: "add.notification"

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG