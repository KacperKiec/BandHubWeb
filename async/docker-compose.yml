services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP dla aplikacji
      - "15672:15672" # Panel administracyjny
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    networks:
      - rabbitmq-network

networks:
  rabbitmq-network:
    driver: bridge
