<div class="container fade-in">
  <ng-container *ngIf="!isConfirmed">
    <p class="info-tab">Poniżej podaj swój adres email, na który zostanie przesłane nowe tymczasowe hasło.</p>

    <div class="credential">
      <input placeholder="Email" [(ngModel)]="email" required>
    </div>

    <button class="confirm-button" (click)="confirm()">
      <label>Kontynuuj</label>
    </button>
  </ng-container>

  <p class="info-tab" *ngIf="isConfirmed">Na podany adres email została wysłana wiadomość z hasłem tymczasowym. Wykorzystaj je do zalogowania się.</p>
</div>
