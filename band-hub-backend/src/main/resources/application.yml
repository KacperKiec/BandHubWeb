spring:
  application:
    name: band-hub-backend
  datasource:
    url: jdbc:mysql://localhost:3306/band_hub_db?createDatabaseIfNotExist=true
    username: developer
    password: developer
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true