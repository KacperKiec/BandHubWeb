<div class="wrapper">
  <div class="band-details-container fade-in">

    <div *ngIf="hasBands && !editingMode">
      <h2 class="panel-title">Twoje zespoły</h2>

      <div>
        <div class="band-grid">
          <div class="band-card" *ngFor="let band of userBands">
            <div class="band-header">
              <h3 class="band-name">{{ band.name }}</h3>
            </div>

            <p class="band-description">
              {{ band.bio || 'Brak opisu zespołu.' }}
            </p>

            <div class="band-actions">
              <button class="btn2" (click)="viewBandDetails(band.id)">Szczegóły</button>
              <button *ngIf="band.founderId === userId" class="btn2" (click)="removeBand()">Rozwiąż zespół</button>
              <button *ngIf="band.founderId !== userId" class="btn2" (click)="leaveBand(band.id)">Opuść</button>
              <button *ngIf="band.founderId === userId" class="btn2" (click)="turnEditingMode(band)">Edytuj</button>
            </div>
          </div>
        </div>

        <div class="option create-option">
          <label class="create-label">Ciągle ci mało?</label>
          <button class="btn2" (click)="createAnotherBand()">Załóż zespół</button>
        </div>
      </div>
    </div>

    <div *ngIf="editingMode">
      <app-edit-band
      [userId]="userId"
      [bandTemplate]="bandToEdit"
      (updated)="handleBandUpdating($event)">
      </app-edit-band>
    </div>

    <div class="join-band-card" *ngIf="!hasBands">
      <h2 *ngIf="!showForm">Nie jesteś jeszcze członkiem żadnego zespołu!</h2>

      <div class="joining-options" *ngIf="!showForm">
        <div class="option">
          <button class="btn" (click)="showRegistrationForm()">Załóż zespół</button>
          <p>Stwórz swój własny zespół i wyczekuj zgłoszeń nowych członków!</p>
        </div>

        <div class="option">
          <button class="btn" (click)="goToBands()">Dołącz do zespołu</button>
          <p>Nawiąż kontakt z innymi muzykami poprzez czat i dołącz do ich zespołów!</p>
        </div>
      </div>

      <app-register-band
        *ngIf="showForm"
        (registered)="handleBandRegistration($event)"
        [userId]="userId">

      </app-register-band>
    </div>

  </div>
</div>
