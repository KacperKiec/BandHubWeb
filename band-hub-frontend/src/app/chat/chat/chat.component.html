<div class="chat-container" *ngIf="userId">
  <aside class="sidebar">
    <div class="search-users">
      <input type="text" placeholder="Szukaj użytkowników..." [(ngModel)]="searchText" />
      <ul *ngIf="searchText">
        <li *ngFor="let user of filteredUsers">{{ user }}</li>
      </ul>
    </div>

    <h3>Twoje czaty</h3>
    <ul class="chat-list">
      <li
        *ngFor="let chat of chats"
        (click)="selectChat(chat)"
        [class.active]="chat.id === selectedChatId"
      >
        <div class="chat-name">{{ chat.receiverFirstName }} {{ chat.receiverLastName }}</div>
      </li>
    </ul>
  </aside>

  <main class="chat-main">
    <header class="chat-header">
      <h3>
        {{ findChat() }}
      </h3>
    </header>

    <section class="chat-messages">
      <div
        *ngFor="let msg of messages"
        [class.message-me]="isMessageFromCurrentUser(msg)"
        [class.message-other]="!isMessageFromCurrentUser(msg)"
        class="message"
      >
        <p>{{ msg.content }}</p>
        <span class="time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
    </section>

    <footer class="chat-input">
      <input type="text" placeholder="Napisz wiadomość..." disabled />
      <button disabled>Wyślij</button>
    </footer>
  </main>
</div>

<div class="alert-info" *ngIf="!userId" (click)="goToLogin()">
  <p>Zaloguj się, aby przejsc do czatu!</p>
</div>
