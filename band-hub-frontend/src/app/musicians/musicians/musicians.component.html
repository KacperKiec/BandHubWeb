<div class="container">
  <app-search-bar [filters]="filters" [placeholderText]="placeholderText" (emitParams)="getParams($event)"></app-search-bar>
  <app-search-result
    [results]="musiciansToDisplay"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="loadPage($event)"
    (showDetails)="goToDetails($event)">
  </app-search-result>

</div>
