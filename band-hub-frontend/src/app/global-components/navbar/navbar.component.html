<div class="navbar" [ngClass]="{'show': isMenuOpen, 'hide': !isMenuOpen}">
  <div class="option" routerLink="/home">
    <img class="icon" ngSrc="/icons8-home-48.png" height="32" width="32" alt="Menu Icon">
    <label>Start</label>
  </div>
  <div class="option" routerLink="/musicians">
    <img class="icon" ngSrc="/icons8-electric-guitar-64.png" height="32" width="32" alt="Musician Icon">
    <label>Muzycy</label>
  </div>
  <div class="option" routerLink="/bands">
    <img class="icon" ngSrc="/icons8-drums-60.png" height="32" width="32" alt="Band Icon">
    <label>Zespoły</label>
  </div>
  <div class="option" routerLink="/events">
    <img class="icon" ngSrc="/icons8-event-48.png" height="32" width="32" alt="Events Icon">
    <label>Wydarzenia</label>
  </div>
  <div class="option" routerLink="/offers">
    <img class="icon" ngSrc="/icons8-place-50.png" height="32" width="32" alt="Offers Icon">
    <label>Lokale</label>
  </div>
  <div class="option" (click)="goToCurrentUerProfile()">
    <img class="icon" ngSrc="/icons8-user-48.png" height="32" width="32" alt="User Icon">
    <label>Profil</label>
  </div>
  <div class="option" routerLink="/chat">
    <img class="icon" ngSrc="/icons8-chat-message-48.png" height="32" width="32" alt="Chat Icon">
    <label>Czat</label>
  </div>
  <div class="option" (click)="authAction()">
    <img *ngIf="isUserLoggedIn" class="icon" ngSrc="/icons8-log-out-48.png" height="32" width="32" alt="Sign Out Icon">
    <label *ngIf="isUserLoggedIn">Wyloguj</label>

    <img *ngIf="!isUserLoggedIn" class="icon" ngSrc="/icons8-enter-48.png" height="32" width="32" alt="Sign In Icon">
    <label *ngIf="!isUserLoggedIn">Zaloguj</label>
  </div>

  <div class="nav-button" (click)="toggleMenu()">
    <img id="arrow" ngSrc="/icons8-arrow-48.png" height="24" width="24" alt="Toggle Button">
  </div>
</div>
