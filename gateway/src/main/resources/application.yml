spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4202"
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true
      routes:
        - id: music-service
          uri: lb://MUSIC-SERVICE
          predicates:
            - Path=/musician/**, /band/**, /genre/**, /instrument/**
        - id: user-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/account/**, /role/**, /logout
        - id: venue-service
          uri: lb://VENUE-SERVICE
          predicates:
            - Path=/venue/**, /booking/**, /offer/**
        - id: event-service
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/event/**
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**, /key/**, /oauth2/**
        - id: notification-service
          uri: lb://NOTIF-SERVICE
          predicates:
            - Path=/notification/**
#      discovery:
#        locator:
#          enabled: true
#          lower-case-service-id: true
server:
  port: 9000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.security.web.FilterChainProxy=DEBUG:
    org.springframework.web.cors: DEBUG