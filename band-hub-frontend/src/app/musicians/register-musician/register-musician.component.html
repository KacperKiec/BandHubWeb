<div class="register-container">
  <h2>Zarejestruj się jako muzyk 🎵</h2>
  <p class="subtitle">Uzupełnij informacje, które pozwolą innym Cię znaleźć.</p>

  <app-musician-input
    [userId]="userId"
    [availableGenres]="availableGenres"
    [availableInstruments]="availableInstruments"
    (outputMusician)="getMusician($event)">
  </app-musician-input>

  <button type="submit" class="submit-btn" (click)="submit()">Zarejestruj się jako muzyk</button>

</div>
