<div class="container">
  <div class="nav-button">
    <img id="menu" (click)="openMenu()" ngSrc="/icons8-menu-64-light.png" height="32" width="32" alt="Toggle Button">
  </div>
  <div class="title" routerLink="/home">TYTUL</div>
  <div class="right-section">
    <div class="bell-container" *ngIf="isUserLoggedIn">
      <img class="bell" ngSrc="/icons8-bell-48.png" height="30" width="30" alt="Notification Icon" (click)="toggleNotificationPanel($event)">
      <span class="notification-badge" *ngIf="notifications.length > 0"></span>
    </div>

    <app-notification-panel
      #notificationPanel
      *ngIf="showNotificationPanel"
    (markNotification)="updateNotifications()">
    </app-notification-panel>

    <div class="log-button" (click)="action()">
      <img *ngIf="isUserLoggedIn" ngSrc="/icons8-male-user-48.png" height="32" width="32">

      <label *ngIf="!isUserLoggedIn">Zaloguj</label>
    </div>

    <div class="dropdown-menu" *ngIf="showDropdown" #dropdownMenu>
      <div (click)="goToUserProfile()">Profil</div>
      <div (click)="goToUserBands()">Zespół</div>
      <div (click)="goToRentingPanel()">Moje lokale</div>
      <div (click)="goToUserBookings()">Rezerwacje</div>
      <div (click)="goToUserEvents()">Harmonogram</div>
      <div (click)="logOut()">Wyloguj</div>
    </div>

  </div>
</div>
