<div class="calendar-wrapper demo-app-calendar p-4">

  <div class="calendar-header text-center mb-3">
    <button
      class="btn btn-outline-primary"
      mwlCalendarPreviousView
      [view]="view"
      [(viewDate)]="viewDate"
      (viewDateChange)="viewDate = $event"
    >⬅️ Poprzedni</button>

    <h2 class="calendar-header-text">{{ viewDate | date: 'LLLL yyyy':'':'pl' }}</h2>

    <button
      class="btn btn-outline-primary"
      mwlCalendarNextView
      [view]="view"
      [(viewDate)]="viewDate"
      (viewDateChange)="viewDate = $event"
    >Następny ➡️</button>
  </div>


  <mwl-calendar-month-view
    [viewDate]="viewDate"
    [events]="events"
    [cellTemplate]="customCellTemplate"
    (eventClicked)="eventClicked($event)">
  </mwl-calendar-month-view>


  <ng-template #customCellTemplate let-day="day" let-locale="locale">
    <div class="cal-cell-top mb-1 text-end pe-1">
      <small
        class="fw-bold"
        [style.color]="day.inMonth ? '#212529' : '#ccc'"
      >
        {{ day.date | date:'d' }}
      </small>
    </div>
    <div class="cal-events d-flex flex-column gap-1">
      <div
        *ngFor="let event of day.events"
        class="custom-event-bar"
        (click)="showDetails(event.id)"
      >
        {{ event.title }}
      </div>
    </div>
  </ng-template>

</div>
