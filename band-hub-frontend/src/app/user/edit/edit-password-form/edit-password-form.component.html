<div class="container fade-in">
  <input name="email" [(ngModel)]="formData.oldPassword" type="password" placeholder="Stare hasło" required>
  <input name="password" [(ngModel)]="formData.newPassword" type="password" placeholder="Nowe hasło" required>
  <input name="repeatPassword" [(ngModel)]="formData.repeatPassword" type="password" placeholder="Powtórz nowe hasło" required>

  <button type="submit" class="confirm-button" (click)="changePassword()">Zapisz</button>
</div>
