<div class="container fade-in">
  <ng-container *ngIf="!showForm && !editingMode">
    <h2 class="header">Twoje Wydarzenia</h2>

    <div class="calendar-container">
      <app-calendar
      [userEvents]="events"
      (getDetails)="showDetails($event)">
      </app-calendar>
    </div>

    <div class="add-event-container">
      <p>Dodaj swoje wydarzenie i opublikuj je w sieci</p>
      <button (click)="showRegistrationForm()">Dodaj</button>
    </div>
  </ng-container>

  <app-register-event
    *ngIf="showForm"
    [userId]="userId"
    [bookings]="bookings"
    [userBands]="userBands"
    [venues]="userVenues"
    (registered)="handleEventRegistration($event)">
  </app-register-event>

  <app-edit-event-form
    *ngIf="editingMode"
    [userId]="userId"
    [bookings]="bookings"
    [userBands]="userBands"
    [venues]="userVenues"
    [eventTemplate]="eventToEdit"
    (updated)="handleEventUpdating($event)">
  </app-edit-event-form>

  <div class="details-backdrop" *ngIf="isDetailsVisible" (click)="closeDetails()" [@backdropFadeInOut]></div>

  <app-event-details
    *ngIf="isDetailsVisible && eventDetails"
    [@detailsFadeInOut]
    [userId]="userId"
    [eventDetails]="eventDetails"
    (closeDetailsEvent)="closeDetails()"
    (turnEditingModeEvent)="turnEditingMode($event)">
  </app-event-details>

</div>
