<div class="tab-container fade-in">
  <div class="tabs">
    <button
      class="tab-button"
      [class.active]="activeTab === 'venues'"
      (click)="activeTab = 'venues'">
      📍 Lokale
    </button>

    <button
      class="tab-button"
      [class.active]="activeTab === 'offers'"
      (click)="activeTab = 'offers'">
      📢 Oferty
    </button>

    <button
      class="tab-button"
      [class.active]="activeTab === 'bookings'"
      (click)="activeTab = 'bookings'">
      📖 Rezerwacje
    </button>
  </div>

  <div class="tab-content" [ngSwitch]="activeTab">
    <app-user-venues
      *ngSwitchCase="'venues'"
      [venues]="venues"
      [userId]="userId"
      (updateData)="updateData($event)">
    </app-user-venues>

    <app-user-offers
      *ngSwitchCase="'offers'"
      [venues]="venues"
      [offers]="offers"
      [userId]="userId"
      (updateData)="updateData($event)">
    </app-user-offers>

    <app-owner-bookings
      *ngSwitchCase="'bookings'"
      [userId]="userId"
      [offers]="offers"
      [bookings]="bookings"
      [currentPage]="currentPageB"
      [totalPages]="totalPagesB"
      (pageChange)="loadBookingPage($event)"
      (updateData)="updateData($event)">
    </app-owner-bookings>
  </div>
</div>
